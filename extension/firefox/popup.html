<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recall.ai</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { width: 340px; background: #fafafa; color: #111; font-size: 14px; }
    .header { background: linear-gradient(135deg, #4f46e5, #7c3aed); padding: 14px 16px; color: white; display: flex; align-items: center; gap: 8px; }
    .header svg { width: 22px; height: 22px; }
    .header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
    .header span { font-size: 11px; opacity: 0.75; margin-left: auto; }
    .tabs { display: flex; border-bottom: 1px solid #eee; background: white; }
    .tab { flex: 1; padding: 9px; font-size: 12px; font-weight: 600; text-align: center; cursor: pointer; border: none; background: none; color: #888; transition: color 0.15s, border-bottom 0.15s; border-bottom: 2px solid transparent; }
    .tab.active { color: #4f46e5; border-bottom-color: #4f46e5; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .section { padding: 14px 16px; }
    .label { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    input, textarea { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; background: white; outline: none; transition: border 0.15s; }
    input:focus, textarea:focus { border-color: #4f46e5; }
    textarea { resize: none; min-height: 70px; line-height: 1.5; }
    .btn { width: 100%; padding: 9px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
    .btn-primary { background: #4f46e5; color: white; }
    .btn-primary:hover { opacity: 0.88; }
    .btn-secondary { background: white; border: 1px solid #ddd; color: #333; }
    .btn-secondary:hover { background: #f5f5f5; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-mic { width: 48px; height: 48px; border-radius: 50%; background: #4f46e5; color: white; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
    .btn-mic.recording { background: #ef4444; animation: pulse 1.5s infinite; }
    .btn-mic:hover { opacity: 0.85; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); } 50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); } }
    .voice-row { display: flex; gap: 10px; align-items: flex-start; }
    .voice-col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .gap { height: 8px; }
    .divider { height: 1px; background: #eee; margin: 0 16px; }
    .article { padding: 8px 10px; background: white; border: 1px solid #eee; border-radius: 8px; margin-bottom: 6px; }
    .article-title { font-weight: 600; font-size: 12px; color: #111; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .article-verdict { font-size: 11px; color: #666; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .status { font-size: 12px; color: #4f46e5; padding: 4px 0; min-height: 18px; }
    .status.error { color: #ef4444; }
    .open-link { display: block; text-align: center; color: #4f46e5; font-size: 12px; font-weight: 500; padding: 10px; text-decoration: none; }
    .open-link:hover { text-decoration: underline; }
    .current-url { font-size: 11px; color: #666; background: #f3f4f6; padding: 6px 10px; border-radius: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #888; }
    .logout-btn { background: none; border: none; cursor: pointer; color: #4f46e5; font-size: 11px; font-weight: 500; }
    .voice-recent { margin-top: 8px; }
    .voice-item { padding: 7px 10px; background: white; border: 1px solid #eee; border-radius: 8px; margin-bottom: 5px; }
    .voice-item-summary { font-size: 11px; color: #555; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .voice-item-time { font-size: 10px; color: #aaa; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/>
      <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/>
    </svg>
    <h1>Recall.ai</h1>
    <span id="plan-badge"></span>
  </div>

  <!-- Login View -->
  <div id="login-view" class="section" style="display:none">
    <div class="label">Sign in to save articles</div>
    <div class="gap"></div>
    <input type="email" id="email" placeholder="Email address" autocomplete="email">
    <div class="gap"></div>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <div class="gap"></div>
    <button class="btn btn-primary" id="login-btn">Log in</button>
    <div class="gap"></div>
    <p id="login-status" class="status"></p>
  </div>

  <!-- Logged in View -->
  <div id="logged-view" style="display:none">
    <div class="section" style="padding-bottom:8px">
      <div class="user-bar">
        <span id="user-email"></span>
        <button class="logout-btn" id="logout-btn">Log out</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="save">⚡ Save Page</button>
      <button class="tab" data-tab="voice">🎙 Voice Note</button>
      <button class="tab" data-tab="recent">📚 Recent</button>
    </div>

    <!-- Save Page Tab -->
    <div id="tab-save" class="tab-content active">
      <div class="section">
        <div class="label">Current page</div>
        <div class="gap" style="height:4px"></div>
        <div class="current-url" id="current-url">Loading…</div>
        <div class="gap"></div>
        <button class="btn btn-primary" id="summarise-btn">⚡ Summarise &amp; Save</button>
        <div class="gap"></div>
        <p id="summarise-status" class="status"></p>
      </div>
    </div>

    <!-- Voice Note Tab -->
    <div id="tab-voice" class="tab-content">
      <div class="section">
        <div class="label">Capture a voice note</div>
        <div class="gap" style="height:6px"></div>
        <div class="voice-row">
          <button class="btn-mic" id="mic-btn" title="Start recording">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="2" width="6" height="11" rx="3"/>
              <path d="M5 10a7 7 0 0 0 14 0"/>
              <line x1="12" y1="19" x2="12" y2="22"/>
              <line x1="8" y1="22" x2="16" y2="22"/>
            </svg>
          </button>
          <div class="voice-col">
            <textarea id="voice-transcript" placeholder="Click the mic to start… or type directly here." rows="3"></textarea>
            <button class="btn btn-primary" id="save-voice-btn">Save Voice Note</button>
          </div>
        </div>
        <div class="gap"></div>
        <p id="voice-status" class="status"></p>
        <div class="voice-recent">
          <div class="label" style="margin-bottom:4px">Recent voice notes</div>
          <div id="voice-list"></div>
        </div>
      </div>
    </div>

    <!-- Recent Articles Tab -->
    <div id="tab-recent" class="tab-content">
      <div class="section">
        <div class="label">Recent saves</div>
        <div class="gap" style="height:6px"></div>
        <div id="articles-list"></div>
      </div>
    </div>

    <a href="#" class="open-link" id="open-recall">Open Recall.ai →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
