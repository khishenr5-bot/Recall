<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recall.ai</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { width: 340px; background: #fafafa; color: #111; font-size: 14px; }
    .header { background: linear-gradient(135deg, #4f46e5, #7c3aed); padding: 14px 16px; color: white; display: flex; align-items: center; gap: 8px; }
    .header svg { width: 22px; height: 22px; }
    .header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
    .header span { font-size: 11px; opacity: 0.75; margin-left: auto; }
    .section { padding: 14px 16px; }
    .label { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    input { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; background: white; outline: none; transition: border 0.15s; }
    input:focus { border-color: #4f46e5; }
    .btn { width: 100%; padding: 9px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
    .btn-primary { background: #4f46e5; color: white; }
    .btn-primary:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .gap { height: 8px; }
    .divider { height: 1px; background: #eee; margin: 0 16px; }
    .article { padding: 8px 10px; background: white; border: 1px solid #eee; border-radius: 8px; margin-bottom: 6px; }
    .article-title { font-weight: 600; font-size: 12px; color: #111; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .article-verdict { font-size: 11px; color: #666; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .status { font-size: 12px; color: #4f46e5; padding: 4px 0; min-height: 18px; }
    .open-link { display: block; text-align: center; color: #4f46e5; font-size: 12px; font-weight: 500; padding: 10px; text-decoration: none; }
    .open-link:hover { text-decoration: underline; }
    .current-url { font-size: 11px; color: #666; background: #f3f4f6; padding: 6px 10px; border-radius: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #888; }
    .logout-btn { background: none; border: none; cursor: pointer; color: #4f46e5; font-size: 11px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/>
      <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/>
    </svg>
    <h1>Recall.ai</h1>
    <span id="plan-badge"></span>
  </div>

  <div id="login-view" class="section" style="display:none">
    <div class="label">Sign in to save articles</div>
    <div class="gap"></div>
    <input type="email" id="email" placeholder="Email address" autocomplete="email">
    <div class="gap"></div>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <div class="gap"></div>
    <button class="btn btn-primary" id="login-btn">Log in</button>
    <div class="gap"></div>
    <p id="login-status" class="status"></p>
  </div>

  <div id="logged-view" style="display:none">
    <div class="section">
      <div class="user-bar">
        <span id="user-email"></span>
        <button class="logout-btn" id="logout-btn">Log out</button>
      </div>
      <div class="gap"></div>
      <div class="label">Current page</div>
      <div class="gap" style="height:4px"></div>
      <div class="current-url" id="current-url">Loading…</div>
      <div class="gap"></div>
      <button class="btn btn-primary" id="summarise-btn">⚡ Summarise &amp; Save</button>
      <div class="gap"></div>
      <p id="summarise-status" class="status"></p>
    </div>
    <div class="divider"></div>
    <div class="section">
      <div class="label">Recent saves</div>
      <div class="gap" style="height:6px"></div>
      <div id="articles-list"></div>
    </div>
    <a href="#" class="open-link" id="open-recall">Open Recall.ai →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
